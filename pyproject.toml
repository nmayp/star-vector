[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "starvector"
version = "1.0"
description = "Generating Scalable Vector Graphics Code from Images and Text"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch>=2.0.0", 
    "torchvision>=0.15.0",
    "transformers>=4.40.0", 
    "tokenizers>=0.19.0", 
    "sentencepiece>=0.1.99",    
    "accelerate",
    "pydantic>=2.0", 
    "markdown2[all]", 
    "numpy<2.0.0", 
    "scikit-learn>=1.2.0",
    "gradio>=4.0.0", 
    "gradio_client>=0.10.0",
    "requests", 
    "httpx>=0.24.0", 
    "uvicorn", 
    "fastapi",
    "svgpathtools>=1.6.0", 
    "seaborn>=0.12.0",
    "taming-transformers", 
    "lpips", 
    "cairosvg", 
    "beautifulsoup4", 
    "webcolors", 
    "tqdm",
    "omegaconf", 
    "open-clip-torch", 
    "noise", 
    "datasets", 
    "scikit-image", 
    "fairscale", 
    "lxml", 
    "torch-fidelity", 
    "clip-openai",
    "scipy>=1.10.0",
    "sentence-transformers",
    "reportlab",
    "svglib",
    "Pillow",
    "protobuf",
    "openai"
]

[project.optional-dependencies]
flash-attn = ["flash_attn>=2.5.0"]
train = ["deepspeed", "ninja", "wandb", "flash_attn>=2.5.0"]

[project.urls]
"Homepage" = "https://starvector.github.io"
"Bug Tracker" = "https://github.com/joanrod/starvector/issues"

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]
